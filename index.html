<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roots of Renewal</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    h2 {
      margin-top: 1em;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    .guide-card {
      border: 1px solid #ccc;
      padding: 8px;
      margin: 6px 0;
      border-radius: 6px;
      background: #f9f9f9;
    }
    #discoveryPopup {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffd700;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <h1>Roots of Renewal</h1>
  <div id="monthDisplay"></div>

  <h2>Lot Management</h2>
  <div id="lotDisplay"></div>
  <div id="lotButtons"></div>
  <button onclick="advanceMonth()">Advance Month</button>
  <button onclick="addLot('New Lot', 50)">Add Lot</button>

  <h2>Plants</h2>
  <ul id="plantsList"></ul>

  <h2>Pollinators</h2>
  <ul id="pollinatorsList"></ul>

  <h2>Seed Bank</h2>
  <ul id="seedBankList"></ul>

  <h2>Field Guide</h2>
  <div>
    <button onclick="switchGuideCategory('plants')">Plants</button>
    <button onclick="switchGuideCategory('pollinators')">Pollinators</button>
  </div>
  <div id="fieldGuideEntries"></div>
  <div>
    <button onclick="prevGuidePage()">Previous</button>
    <button onclick="nextGuidePage()">Next</button>
  </div>

  <div id="discoveryPopup"></div>

  <!-- Game Scripts -->
  <script src="speciesData.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
  <script src="time.js"></script>

  <script>
    // Setup initial UI
    document.addEventListener("DOMContentLoaded", () => {
      const lotButtons = document.getElementById("lotButtons");
      function renderLotButtons() {
        lotButtons.innerHTML = "";
        state.lots.forEach((lot, i) => {
          const btn = document.createElement("button");
          btn.textContent = lot.name;
          btn.onclick = () => switchLot(i);
          lotButtons.appendChild(btn);
        });
      }
      renderLotButtons();

      updateUI();
      buildFieldGuide();
    });
  </script>
</body>
</html>
