<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Roots of Renewal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
window.onerror = function(message, source, lineno, colno, error) {
  alert("JS Error: " + message + "\nSource: " + source + "\nLine: " + lineno);
};
</script>
<body class="dark-theme">
  <h1>Roots of Renewal</h1>
  <button id="themeToggle">Switch Theme</button>
  
  <div id="game"></div>

  <div id="monthDisplay"></div>

  <h2>Lot Management</h2>
  <div id="lotDisplay"></div>
  <div id="lotButtons"></div>
  <button onclick="advanceMonth()">Advance Month</button>
  <button onclick="addLot('New Lot', 50)">Add Lot</button>

  <h2>Plants</h2>
  <ul id="plantsList"></ul>

  <h2>Pollinators</h2>
  <ul id="pollinatorsList"></ul>

  <h2>Seed Bank</h2>
  <ul id="seedBankList"></ul>

  <h2>Field Guide</h2>
  <div>
    <button onclick="switchGuideCategory('plants')">Plants</button>
    <button onclick="switchGuideCategory('pollinators')">Pollinators</button>
  </div>
  <div id="fieldGuideEntries"></div>
  <div>
    <button onclick="prevGuidePage()">Previous</button>
    <button onclick="nextGuidePage()">Next</button>
  </div>

  <div id="discoveryPopup"></div>

  <!-- Scripts -->
  <script src="speciesData.js?v=1"></script>
  <script src="time.js?v=1"></script>
  <script src="prestige.js?v=1"></script>
  <script src="game.js?v=1"></script>
  <script src="ui.js?v=1"></script>
  <script>
    // Setup initial UI
    document.addEventListener("DOMContentLoaded", () => {
      const lotButtons = document.getElementById("lotButtons");
      function renderLotButtons() {
        lotButtons.innerHTML = "";
        state.lots.forEach((lot, i) => {
          const btn = document.createElement("button");
          btn.textContent = lot.name;
          btn.onclick = () => switchLot(i);
          lotButtons.appendChild(btn);
        });
      }
      renderLotButtons();

      updateUI();
      buildFieldGuide();
    });
  </script>
</body>
</html>
